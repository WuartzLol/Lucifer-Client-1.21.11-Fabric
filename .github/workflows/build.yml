
name: Build Lucifer Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Extract project ZIP
        run: |
          mkdir source
          unzip -o lucifer-client.zip -d source
          find source -name build.gradle -print

      - name: Build project
        run: |
          PROJECT_DIR="$(dirname "$(find source -name build.gradle -print -quit)")"
          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lucifer-client-jar
          path: source/**/build/libs/*.jar
